# MVP: first version. Save as .github/ISSUE_TEMPLATE/good-first-issue.yml. It will evolve with the project.
name: Good first issue
description: A small, clear task a newcomer can take.
title: "[Good first issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it small. A newcomer should be able to do this without asking permission.
  - type: textarea
    id: task
    attributes:
      label: The task
      description: One clear thing to do.
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Files to touch
      description: Which file or files this changes.
  - type: textarea
    id: done
    attributes:
      label: What "done" looks like
      description: A few plain sentences or bullets.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Who reviews it
  - type: markdown
    attributes:
      value: |
        **What this is not:** a request for personal details, and not a final design. It's a first step.
